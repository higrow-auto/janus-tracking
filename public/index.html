<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Janus — Link Manager</title>
  <link rel="icon" href="/assets/janus-icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="login-screen" class="login-screen hidden">
  <div class="login-card">
    <div class="login-logo"><img src="/assets/janus-icon.svg" width="40" height="40" alt="Janus"> <span>JANUS</span></div>
    <p class="login-sub">Enterprise Link Manager</p>
    <form id="login-form">
      <div class="field">
        <label>Senha de acesso</label>
        <input type="password" id="login-password" placeholder="••••••••" autofocus>
      </div>
      <button type="submit" class="btn btn-primary btn-full">Entrar</button>
      <p id="login-error" class="login-error hidden">Senha incorreta</p>
    </form>
  </div>
</div>

<!-- MAIN APP -->
<div id="app" class="app hidden">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-logo"><img src="/assets/janus-icon.svg" width="28" height="28" alt="Janus"> <span>JANUS</span></div>
    <nav class="sidebar-nav">
      <a href="#" data-page="dashboard" class="nav-item active">
        <svg viewBox="0 0 24 24"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg>
        Dashboard
      </a>
      <a href="#" data-page="links" class="nav-item">
        <svg viewBox="0 0 24 24"><path d="M17 7h-4v2h4c1.65 0 3 1.35 3 3s-1.35 3-3 3h-4v2h4c2.76 0 5-2.24 5-5s-2.24-5-5-5zm-6 8H7c-1.65 0-3-1.35-3-3s1.35-3 3-3h4V7H7c-2.76 0-5 2.24-5 5s2.24 5 5 5h4v-2zm1-4H8v2h8v-2z"/></svg>
        Links
      </a>
      <a href="#" data-page="campaigns" class="nav-item">
        <svg viewBox="0 0 24 24"><path d="M20 6h-2.18c.07-.44.18-.88.18-1.35C18 2.99 16.21 1.5 14.14 1.5c-1.32 0-2.29.42-3.14 1.35L10 4l-1-1.14C8.29 1.92 7.32 1.5 6 1.5 3.79 1.5 2 2.99 2 4.65c0 .47.1.9.18 1.35H0v14h24V6h-4zm-3-1.35c0 .87-.72 1.57-1.6 1.57S13.8 5.52 13.8 4.65c0-.87.72-1.57 1.6-1.57s1.6.7 1.6 1.57zM6 3.08c.88 0 1.6.7 1.6 1.57S6.88 6.22 6 6.22s-1.6-.7-1.6-1.57.72-1.57 1.6-1.57z"/></svg>
        Campanhas
      </a>
      <a href="#" data-page="analytics" class="nav-item">
        <svg viewBox="0 0 24 24"><path d="M16 6l2.29 2.29-4.88 4.88-4-4L2 16.59 3.41 18l6-6 4 4 6.3-6.29L22 12V6z"/></svg>
        Analytics
      </a>
      <a href="#" data-page="referralPrograms" class="nav-item">
        <svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
        Indicações
      </a>
      <a href="#" data-page="settings" class="nav-item">
        <svg viewBox="0 0 24 24"><path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.07-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.74,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.07,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.44-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.47-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/></svg>
        Configurações
      </a>
    </nav>
    <div class="sidebar-footer">
      <button id="logout-btn" class="btn-ghost-sm">
        <svg viewBox="0 0 24 24"><path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/></svg>
        Sair
      </button>
    </div>
  </aside>

  <!-- Main content -->
  <main class="main">
    <div id="page-content"></div>
  </main>
</div>

<!-- MODAL -->
<div id="modal-overlay" class="modal-overlay hidden">
  <div class="modal" id="modal">
    <div class="modal-header">
      <h3 id="modal-title">Criar Link</h3>
      <button id="modal-close" class="modal-close">&times;</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-footer" id="modal-footer"></div>
  </div>
</div>

<!-- TOAST -->
<div id="toast" class="toast hidden"></div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="/assets/js/app.js"></script>
<script>
  // Load Meta Pixel dynamically if pixel ID is configured
  fetch('/api/config/public').then(r => r.json()).then(cfg => {
    if (!cfg.metaPixelId) return;
    !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;
    n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,
    document,'script','https://connect.facebook.net/en_US/fbevents.js');
    fbq('init', cfg.metaPixelId);
    fbq('track', 'PageView');
  }).catch(() => {});
</script>
</body>
</html>
